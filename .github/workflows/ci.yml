name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine.
          rm -rf .third-party-allowlist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      # shared/feature-entitlement is newer than the released fixture package,
      # so the rows come from a checkout until fancy-conformance cuts the
      # release that carries them. FANCY_CONFORMANCE_ROOT is read FIRST by the
      # runner and a missing root is a FAILURE, not a skip -- a conformance
      # suite that silently does not run reads exactly like full coverage.
      #
      # Drop this step (and the env below) once the installed package has it.
      - name: Check out the shared conformance fixtures
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/fancy-conformance
          path: .fancy-conformance

      - name: Type-check
        run: npm run lint

      - name: Test
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.fancy-conformance
        run: npm test

      - name: Build
        run: npm run build
